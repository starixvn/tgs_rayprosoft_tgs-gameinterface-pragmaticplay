syntax = "proto3";
//import "google/api/http.proto";
import "google/api/annotations.proto";
import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.PragmaticPlay.Protos";

package GameInterfacePragmaticPlay;

// The greeting service definition.
service GameInterfacePragmaticPlay {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply){
    option (google.api.http) = {
      post: "/pp/player/create",
      body: "*"
    };
  };

  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply){
    option (google.api.http) = {
      post: "/pp/player/balance",
      body: "*"
    };
  };

  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply){
    option (google.api.http) = {
      post: "/pp/player/logout",
      body: "*"
    };
  };

  rpc FundIn (FundRequest) returns (FundReply){
    option (google.api.http) = {
      post: "/pp/fund/in",
      body: "*"
    };
  };

  rpc FundOut (FundRequest) returns (FundReply){
    option (google.api.http) = {
      post: "/pp/fund/out",
      body: "*"
    };
  };

  rpc FundStatus(FundStatusRequest) returns (BaseReply){
    option (google.api.http) = {
      post: "/pp/fund/status",
      body: "*"
    };
  };

  rpc GameUrl (GameUrlRequest) returns (GameUrlReply){
    option (google.api.http) = {
      post: "/pp/gameurl",
      body: "*"
    };
  };

  rpc GameRecordByLive (GameRecordRequest) returns (GameRecordReply){
    option (google.api.http) = {
      post: "/pp/game/record/live",
      body: "*"
    };
  };

  rpc GameRecordBySlot (GameRecordRequest) returns (GameRecordReply){
    option (google.api.http) = {
      post: "/pp/game/record/slot",
      body: "*"
    };
  };

  rpc GameRecordByVirtualSports (GameRecordRequest) returns (GameRecordReply){
    option (google.api.http) = {
      post: "/pp/game/record/virtual-sports",
      body: "*"
    };
  };

  rpc GameRecordDetail (GameRecordDetailRequest) returns (GameRecordDetailReply){
    option (google.api.http) = {
      post: "/pp/game/record/detail",
      body: "*"
    };
  };

   rpc GameRecordCancelRound (GameRecordCancelRoundRequest) returns (BaseReply){
    option (google.api.http) = {
      post: "/pp/game/record/cancel",
      body: "*"
    };
  };

  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerCreateRequest {
	string api_url = 1;
	string secure_login = 2;
	string secret_key = 3;
	string player_code = 4;
	string currency_code = 5;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string secure_login = 2;
	string secret_key = 3;
	string player_code = 4;
}

message PlayerLogoutRequest {
	string api_url = 1;
	string secure_login = 2;
	string secret_key = 3;
	string player_code = 4;
}

message FundRequest {
	string api_url = 1;
	string secure_login = 2;
	string secret_key = 3;
	string player_code = 4;
	string order_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1;
	string secure_login = 2;
	string secret_key = 3;
	string player_code = 4;
	string order_id = 5;
}

message GameUrlRequest {
	string api_url = 1;
	string secure_login = 2;
	string secret_key = 3;
	string player_code = 4;
	string external_game_id = 5;
	string language = 6;
	bool isMobile = 7;
	string lobby_url = 8;
}

message GameRecordRequest {
	string api_url = 1;
	string secure_login = 2;
	string secret_key = 3;
	google.protobuf.Timestamp start_time = 4;
}

message GameRecordDetailRequest{
	string api_url = 1;
	string secure_login = 2;
	string secret_key = 3;
	string player_code = 4;
	string external_round_id = 5;
	string external_game_id = 6;
	string language = 7;
}

message GameRecordCancelRoundRequest{
	string api_url = 1;
	string secure_login = 2;
	string secret_key = 3;
	string player_code = 4;
	string external_round_id = 5;
	string external_game_id = 6;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	int64 transaction_id = 1;
	phoenix.protobuf.DecimalValue balance = 2;
	string res = 3;
}

message GameUrlReply{
	bool is_player_exist = 1;
	string game_url = 2;
}

message GameRecordReply {
	google.protobuf.Timestamp next_time = 1;
	repeated GameRecordData items = 2;
}

message GameRecordData {
	string external_round_id = 1;
	string external_game_id = 2;
    string player_code = 3;
	bool is_closed = 4;
	google.protobuf.Timestamp external_created_on = 5;
	google.protobuf.Timestamp external_closed_on = 6;
	phoenix.protobuf.DecimalValue bet = 7;
	phoenix.protobuf.DecimalValue settle = 8;
	phoenix.protobuf.DecimalValue win_loss = 9;
	string additional_data = 10;
}

message GameRecordDetailReply{
	string url = 1;
}

message CheckingServiceReply{
    string machine_name = 1;
}